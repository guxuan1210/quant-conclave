[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantconclave"
version = "0.2.5"
description = "QuantConclave: AI-Powered Institutional Capital Flow Detection for Retail Investors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "statsmodels>=0.14.0",
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.10b0",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=1.2.4,<2.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "typer>=0.21.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "akshare>=1.16.0",
    "apscheduler>=3.10.0,<4.0",
    "tushare>=1.4.29",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "fpdf2>=2.8.0",
    "websocket-client>=1.8.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.6.0",
]

[project.scripts]
quantconclave = "cli.main:app"
# One-release compatibility alias for the pre-rename CLI command.
capitalradar = "cli.main:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["quantconclave*", "capitalradar*", "cli*"]

[tool.setuptools.package-data]
cli = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests requiring external services",
    "smoke: quick sanity-check tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
