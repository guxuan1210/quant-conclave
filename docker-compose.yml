services:
  quantconclave:
    build: .
    env_file:
      - .env
    volumes:
      - quantconclave_data:/home/appuser/.quantconclave
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  quantconclave-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - quantconclave_data:/home/appuser/.quantconclave
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  quantconclave_data:
  ollama_data:
