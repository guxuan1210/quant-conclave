services:
  capitalradar:
    build: .
    env_file:
      - .env
    volumes:
      - capitalradar_data:/home/appuser/.capitalradar
    tty: true
    stdin_open: true

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama

  capitalradar-ollama:
    build: .
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=ollama
    volumes:
      - capitalradar_data:/home/appuser/.capitalradar
    depends_on:
      - ollama
    tty: true
    stdin_open: true
    profiles:
      - ollama

volumes:
  capitalradar_data:
  ollama_data:
