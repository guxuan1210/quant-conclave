<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Chart Test</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; }
  #chart { width: 100%; height: 400px; }
</style>
</head>
<body>
<h2>Chart Test — if this is blank, the library failed to load</h2>
<div id="status" style="margin:10px 0;font-family:monospace;"></div>
<div id="chart"></div>

<script src="/static/lightweight-charts.standalone.production.js"></script>
<script>
var s = document.getElementById("status");
s.textContent = "Checking LightweightCharts...";

if (typeof LightweightCharts === "undefined") {
  s.textContent = "FAIL: LightweightCharts is undefined — library not loaded!";
  s.style.color = "red";
} else {
  s.textContent = "OK: LightweightCharts loaded. Creating chart...";
  try {
    var chart = LightweightCharts.createChart(document.getElementById("chart"), {
      width: 800,
      height: 400,
      layout: { background: { type: "solid", color: "#ffffff" }, textColor: "#1f2328" },
      grid: { vertLines: { color: "#e8eaed" }, horzLines: { color: "#e8eaed" } },
      timeScale: { timeVisible: true },
    });
    var cs = chart.addCandlestickSeries({
      upColor: "#1a7f37", downColor: "#cf222e",
      borderUpColor: "#1a7f37", borderDownColor: "#cf222e",
      wickUpColor: "#1a7f37", wickDownColor: "#cf222e",
    });
    cs.setData([
      { time: "2026-05-15", open: 100, high: 105, low: 98, close: 103 },
      { time: "2026-05-16", open: 103, high: 108, low: 101, close: 107 },
      { time: "2026-05-17", open: 107, high: 110, low: 105, close: 106 },
      { time: "2026-05-18", open: 106, high: 109, low: 104, close: 108 },
      { time: "2026-05-19", open: 108, high: 112, low: 107, close: 111 },
      { time: "2026-05-20", open: 111, high: 115, low: 109, close: 113 },
      { time: "2026-05-21", open: 113, high: 114, low: 108, close: 110 },
      { time: "2026-05-22", open: 110, high: 116, low: 109, close: 115 },
      { time: "2026-05-23", open: 115, high: 118, low: 113, close: 117 },
    ]);
    s.textContent = "SUCCESS: Chart rendered with 9 candles. You should see a chart above.";
    s.style.color = "green";
  } catch(e) {
    s.textContent = "ERROR: " + e.message;
    s.style.color = "red";
  }
}
</script>
</body>
</html>
